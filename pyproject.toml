[project]
name = "mrmkt"
version = "0.1.0"
description = "Mr. Market - stock market stuff"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alpaca-py>=0.44.0",
    "backtrader",
    "dbschema",
    "numpy",
    "pandas",
    "pandas-datareader",
    "psycopg2-binary",
    "pyyaml",
    "requests",
    "tiingo",
    "typer>=0.27.2",
    "websocket-client",
]

[project.scripts]
mrmkt = "mrmkt.cli.main:app"

[dependency-groups]
dev = [
    "plotly==5.24.1",
    "pyhamcrest",
    "pytest-bdd>=8.1.0",
    "requests-mock",
    "vectorbt>=1.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build]
dev-mode-dirs = [".", "src"]

[tool.hatch.build.targets.wheel]
packages = ["src/mrmkt"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
