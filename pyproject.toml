[project]
name = "mrmkt"
version = "0.1.0"
description = "Mr. Market - stock market stuff"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "backtrader",
    "dbschema",
    "numpy",
    "pandas",
    "pandas-datareader",
    "psycopg2-binary",
    "pyyaml",
    "requests",
    "tiingo",
    "websocket-client",
]

[dependency-groups]
dev = [
    "pyhamcrest",
    "requests-mock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build]
dev-mode-dirs = [".", "src"]

[tool.hatch.build.targets.wheel]
packages = ["src/mrmkt"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
