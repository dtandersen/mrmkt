[project]
name = "mrmkt"
version = "0.1.0"
description = "Mr. Market - stock market stuff"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alpaca-py>=0.44.0",
    "attrs>=26.1.0",
    "backtrader",
    "dbschema",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "litestar>=2.24.0",
    "numpy",
    "pandas",
    "pandas-datareader",
    "psycopg2-binary",
    "pyyaml",
    "requests",
    "tiingo",
    "typer>=0.27.2",
    "typing-extensions>=4.16.0",
    "uvicorn>=0.54.0",
    "websocket-client",
]

[project.scripts]
mrmkt = "mrmkt.cli.main:app"

[dependency-groups]
dev = [
    "playwright>=1.63.0",
    "plotly==5.24.1",
    "pyhamcrest",
    "pytest-bdd>=8.1.0",
    "requests-mock",
    "vectorbt>=1.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src"]
exclude = ["src/mrmkt/ext/api_gen"]

[tool.ruff.lint]
# Same rule set as pi-lens's bundled fallback (config/ruff/core.toml), so
# local `ruff check` reproduces what pi-lens reports. A project-local config
# overrides that fallback outright, hence the explicit mirror.
select = [
  "E",
  "W",
  "F",
  "I",
  "B",
  "UP",
  "SIM",
  "C4",
  "PIE",
  "S",
]
ignore = [
  "E501",
  "B008",
  "SIM108",
  "S101",
  "S311",
  "S603",
  "S607",
]

[tool.pyright]
exclude = ["src/mrmkt/ext/api_gen"]

[tool.hatch.build]
dev-mode-dirs = [".", "src"]

[tool.hatch.build.targets.wheel]
packages = ["src/mrmkt"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mrmkt.api-codegen]
# Regenerating the API client (see docs/api.md "Generated Python client"):
# 1. re-export api/openapi.json from the app (tests/test_api_spec.py enforces parity)
# 2. uvx openapi-python-client@0.29.1 generate --path api/openapi.json --output-path src/mrmkt/ext/api_gen --meta none --overwrite
spec = "api/openapi.json"
output = "src/mrmkt/ext/api_gen"
generator = "openapi-python-client==0.29.1"
command = "uvx openapi-python-client generate --path api/openapi.json --output-path src/mrmkt/ext/api_gen --meta none --overwrite"
