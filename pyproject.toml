[project]
name = "mrmkt"
version = "0.1.0"
description = "Mr. Market - stock market stuff"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alpaca-py>=0.44.0",
    "backtrader",
    "dbschema",
    "numpy",
    "pandas",
    "pandas-datareader",
    "psycopg2-binary",
    "pyyaml",
    "requests",
    "tiingo",
    "typer>=0.27.2",
    "websocket-client",
]

[project.scripts]
mrmkt = "mrmkt.cli.main:app"

[dependency-groups]
dev = [
    "plotly==5.24.1",
    "pyhamcrest",
    "pytest-bdd>=8.1.0",
    "requests-mock",
    "vectorbt>=1.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
# Same rule set as pi-lens's bundled fallback (config/ruff/core.toml), so
# local `ruff check` reproduces what pi-lens reports. A project-local config
# overrides that fallback outright, hence the explicit mirror.
select = [
  "E",
  "W",
  "F",
  "I",
  "B",
  "UP",
  "SIM",
  "C4",
  "PIE",
  "S",
]
ignore = [
  "E501",
  "B008",
  "SIM108",
  "S101",
  "S311",
  "S603",
  "S607",
]

[tool.hatch.build]
dev-mode-dirs = [".", "src"]

[tool.hatch.build.targets.wheel]
packages = ["src/mrmkt"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
