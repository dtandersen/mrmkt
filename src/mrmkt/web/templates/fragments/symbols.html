{% if tickers %}
<div class="table-wrap">
<table class="tbl tbl-symbols">
  <thead><tr><th>Symbol</th><th>Exchange</th><th>Type</th></tr></thead>
  <tbody>
  {% for ticker in tickers %}
    <tr><td>{{ ticker.ticker }}</td><td>{{ ticker.exchange }}</td><td>{{ ticker.type }}</td></tr>
  {% endfor %}
  </tbody>
</table>
</div>
{% else %}
<p class="empty">No symbols found.</p>
{% endif %}
